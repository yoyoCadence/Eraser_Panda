name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Python libs used by tests to prove cleaned files still open
        run: pip install python-docx openpyxl python-pptx
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: E2E smoke (file://, zero network)
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: eraser-panda-html
          path: dist/index.html
